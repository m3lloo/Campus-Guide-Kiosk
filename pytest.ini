[pytest]
# Pytest configuration for Campus Guide Kiosk
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --disable-warnings
    --tb=short

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    security: Security tests
    mock_firebase: Tests requiring Firebase mocks

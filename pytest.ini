[pytest]
# Pytest configuration for Campus Guide Kiosk

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --disable-warnings
    --tb=short

# Timeout for tests (seconds)
timeout = 30

# Markers for organizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    security: Security tests
    mock_firebase: Tests requiring Firebase mocks

# Test paths
testpaths = tests

# Minimum Python version
minversion = 7.0

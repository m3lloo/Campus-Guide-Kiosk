services:
  web:
    build: .
    container_name: campus_guide_kiosk
    ports:
      - "5000:5000"
    # Secrets (GEMINI_API_KEYS, FIREBASE_*, RELOAD_SECRET, ...) come from .env.
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
    volumes:
      # Firebase service-account key, never baked into the image
      - ./firebase:/app/firebase:ro
      - ./logs:/app/logs
    restart: unless-stopped
    # The image has no curl; the Dockerfile HEALTHCHECK (python/urllib) is used.

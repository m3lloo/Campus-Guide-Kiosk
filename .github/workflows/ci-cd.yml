name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Test what ships: the Dockerfile uses 3.11, and the pinned
        # torch==2.0.0 / numpy==1.24.0 have no wheels for 3.12.
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # CPU-only torch: the default wheel drags in several GB of CUDA libraries.
        pip install torch==2.0.0 --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements-dev.txt

    - name: Lint (undefined names, unused imports and variables)
      run: flake8 app.py config.py error_handlers.py logging_config.py tools tests --select=F --show-source

    - name: Check formatting (advisory)
      continue-on-error: true
      run: black --check app.py config.py error_handlers.py logging_config.py tools tests

    - name: Run tests with pytest
      run: pytest tests/ --cov=. --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Bandit security check (advisory)
      continue-on-error: true
      run: |
        pip install bandit
        bandit -r app.py config.py error_handlers.py logging_config.py tools -ll

    - name: Check for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        extra_args: --debug --only-verified

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        load: false
        tags: campus-guide-kiosk:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'

  # Deploy jobs are skipped automatically until the matching secrets exist.
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
    - name: Deploy to staging
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      run: |
        if [ -z "$DEPLOY_HOST" ]; then
          echo "DEPLOY_HOST secret not configured. Skipping deployment."
          exit 0
        fi
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -t rsa "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

        ssh "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
          set -e
          cd /app/campus-guide-kiosk
          git pull origin develop
          docker compose up -d --build
        EOF

  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      DEPLOY_CONFIGURED: ${{ secrets.PROD_DEPLOY_HOST != '' }}

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to production
      env:
        DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
      run: |
        if [ -z "$DEPLOY_HOST" ]; then
          echo "PROD_DEPLOY_HOST secret not configured. Skipping deployment."
          exit 0
        fi
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -t rsa "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

        ssh "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
          set -e
          cd /app/campus-guide-kiosk
          git pull origin main
          docker compose up -d --build
          # The model takes a while to load; allow up to ~2 minutes.
          for i in $(seq 1 24); do
            curl -fsS http://localhost:5000/api/v1/health && exit 0
            sleep 5
          done
          echo "Health check failed after deploy" >&2
          exit 1
        EOF

    - name: Create GitHub Release
      if: env.DEPLOY_CONFIGURED == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Release ${{ github.run_number }}
        body: Automated production release
